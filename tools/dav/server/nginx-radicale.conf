# nginx site for Radicale on its own host name, e.g. dav.example.com.
# Nginx Proxy Manager: create the proxy host (scheme http, host `radicale`,
# port 5232, Let's Encrypt, Force SSL), then paste the lines below into its
# Advanced tab (the `location /` part is already done by the UI).
server {
    listen 443 ssl;
    server_name dav.example.com;
    # ssl_certificate ... (Let's Encrypt, as on your other hosts)

    # iOS and DAVx5 look these up first (RFC 6764)
    location = /.well-known/caldav  { return 301 /; }
    location = /.well-known/carddav { return 301 /; }

    location / {
        proxy_pass http://radicale:5232;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Authorization;
        proxy_buffering off;          # big REPORT responses stream to the deck
        client_max_body_size 10m;     # events with attachments from the phone
    }
}
